<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b0d">
    <meta name="robots" content="noindex,nofollow">
    <title>Страница не найдена — OpenWrt RMM</title>
    <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=33">
  </head>
  <body class="system-state-page">
    <main class="system-state" data-tone="neutral">
      <header class="system-state-header">
        <a class="system-state-brand" href="/">OpenWrt RMM</a>
        <span class="system-state-code">404 · ROUTE NOT FOUND</span>
      </header>
      <div class="system-state-symbol" aria-hidden="true"><svg class="icon icon-state"><use href="/assets/icons/tabler-sprite.svg#icon-error-404"></use></svg></div>
      <h1>Страница не найдена</h1>
      <p>Такого адреса нет или страница была перемещена. Вернитесь к списку объектов и продолжите работу.</p>
      <dl class="system-state-context">
        <div><dt>Состояние</dt><dd>Маршрут отсутствует</dd></div>
        <div><dt>Действие</dt><dd>Открыть Fleet</dd></div>
      </dl>
      <footer class="system-state-actions">
        <a class="button primary" href="/app">К объектам</a>
        <a class="button" href="/">На главную</a>
      </footer>
    </main>
  </body>
</html>
