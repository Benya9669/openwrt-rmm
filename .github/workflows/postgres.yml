name: PostgreSQL regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: rmm_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: rmm_import_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmm_test -d rmm_import_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create separate empty test databases
        env:
          PGPASSWORD: isolated-ci-password
        run: |
          createdb -h 127.0.0.1 -U rmm_test rmm_fresh_test
          createdb -h 127.0.0.1 -U rmm_test rmm_critical_test
          createdb -h 127.0.0.1 -U rmm_test rmm_recovery_source
          createdb -h 127.0.0.1 -U rmm_test rmm_recovery_target
      - name: Build recovery verifier image
        run: docker build -t rmm-recovery-ci .
      - name: Run import, concurrency and real dump/restore tests
        env:
          RMM_TEST_POSTGRES_URL: postgres://rmm_test:isolated-ci-password@127.0.0.1:5432/rmm_import_test?sslmode=disable
          RMM_TEST_POSTGRES_FRESH_URL: postgres://rmm_test:isolated-ci-password@127.0.0.1:5432/rmm_fresh_test?sslmode=disable
          RMM_TEST_POSTGRES_CRITICAL_URL: postgres://rmm_test:isolated-ci-password@127.0.0.1:5432/rmm_critical_test?sslmode=disable
          RMM_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RMM_TEST_POSTGRES_RECOVERY_SOURCE_URL: postgres://rmm_test:isolated-ci-password@127.0.0.1:5432/rmm_recovery_source?sslmode=disable
          RMM_TEST_POSTGRES_RECOVERY_TARGET_URL: postgres://rmm_test:isolated-ci-password@127.0.0.1:5432/rmm_recovery_target?sslmode=disable
          RMM_TEST_RECOVERY_IMAGE: rmm-recovery-ci
          RMM_TEST_RECOVERY_POSTGRES_IMAGE: postgres:${{ matrix.version }}
        run: go test -race -count=1 -v ./server/internal/dbmigrate
